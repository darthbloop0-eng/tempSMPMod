plugins {
	id 'maven-publish'
	id 'org.quiltmc.loom' version '1.4.1'
}

base {
	archivesName = project.archives_base_name
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

repositories {
	mavenCentral()
	// GeckoLib 4
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
	// Cardinal Components API (moved from ladysnake.jfrog.io in 2023)
	maven {
		name = 'Ladysnake'
		url = 'https://maven.ladysnake.org/releases'
		content {
			includeGroupByRegex 'dev\\.onyxstudios.*'
			includeGroupByRegex 'org\\.ladysnake.*'
			includeGroupByRegex 'io\\.github\\.ladysnake.*'
		}
	}
	// Reach Entity Attributes
	maven {
		name = 'JamiesWhiteShirt'
		url = 'https://maven.jamieswhiteshirt.com/libs-release'
		content {
			includeGroup 'com.jamieswhiteshirt'
		}
	}
}

loom {
	accessWidenerPath = file('src/main/resources/mason.accesswidener')

	mods {
		mason {
			sourceSet('main')
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "org.quiltmc:quilt-mappings:${project.quilt_mappings}:intermediary-v2"
	modImplementation "org.quiltmc:quilt-loader:${project.loader_version}"

	// QSL comes in transitively through Quilted Fabric API
	modImplementation "org.quiltmc.quilted-fabric-api:quilted-fabric-api:${project.quilted_fabric_api_version}"

	// GeckoLib 4 (not bundled: install it in mods/ next to this jar)
	modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:${project.geckolib_version}"

	// Cardinal Components (bundled, and depended on in quilt.mod.json so it loads)
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
	include "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
	include "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"

	// Reach / attack range attributes used by the glaive
	include modImplementation("com.jamieswhiteshirt:reach-entity-attributes:${project.reach_attributes_version}")

	// Annotations the 1.19 source imports (javax.annotation.Nullable, org.jetbrains.annotations.Nullable)
	compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
	compileOnly 'org.jetbrains:annotations:24.0.1'
}

processResources {
	inputs.properties 'version': project.version, 'group': project.group

	filesMatching('quilt.mod.json') {
		expand 'version': project.version, 'group': project.group
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 17
	// javac stops at 100 errors by default; show them all so the build summary is complete
	it.options.compilerArgs += ['-Xmaxerrs', '5000']
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
	withSourcesJar()
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
