# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft / Quilt toolchain (1.20.1)
minecraft_version=1.20.1
quilt_mappings=1.20.1+build.23
loader_version=0.21.0
# Quilted Fabric API pulls in the matching QSL automatically
quilted_fabric_api_version=7.4.0+0.90.0-1.20.1

# Mod properties
mod_version=1.1.3
maven_group=arathain
archives_base_name=mason-decor

# Dependencies (all must be 1.20.1 builds)
# GeckoLib 4 is a rewrite of the GeckoLib 3 API the 1.19 source uses.
# 4.4 is confirmed on the GeckoLib maven. Newer 4.x need a newer fabricloader than Quilt may report.
geckolib_version=4.4
# Cardinal Components 5.2.x is the 1.20/1.20.1 line (maven moved to maven.ladysnake.org)
cardinal_components_version=5.2.3
# Reach Entity Attributes: 2.4.0 is tagged for 1.20 (needs minecraft >=1.20).
# If it fails to resolve or load, try 2.3.x before changing anything else.
reach_attributes_version=2.4.0
